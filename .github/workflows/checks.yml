name: Checks

# Compiles and tests on GitHub instead of the developer's machine: clippy, the studio shell tests
# (incl. the click sweep that caught the freeze) and the desktop app build.
on:
  workflow_dispatch:
  push:
    branches: [studio-redesign, 'worktree-agent-*']

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 300 # TEMP-FULL-UI-SUITE: was 120; restore at merge
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: checks
          cache-on-failure: true

      - name: Clippy (ui-egui, engine, app)
        run: cargo clippy -p photocraft-ui-egui -p photocraft-engine -p photocraft --all-targets -- -D warnings

      - name: Studio shell tests
        run: cargo test -p photocraft-ui-egui --lib -- studio start_screen home new_doc codex theme

      - name: Engine prefs tests
        run: cargo test -p photocraft-engine --lib prefs

      - name: App tests
        run: cargo test -p photocraft --bins

      # TEMP-FULL-UI-SUITE (agent branch only; drop at merge): the whole ui-egui suite, with the
      # craft-fonts build input so the CJK/Arabic glyph tests have their fonts.
      - name: "TEMP: craft-fonts"
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          path: craft-fonts
          persist-credentials: false
      - name: "TEMP: full ui-egui tests"
        shell: bash
        run: CRAFT_FONTS_DIR="$PWD/craft-fonts" cargo test -p photocraft-ui-egui --lib --tests --no-fail-fast
